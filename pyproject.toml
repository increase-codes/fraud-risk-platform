[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-risk-platform"
version = "0.1.0"
description = "Production-grade fraud risk machine learning platform"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]